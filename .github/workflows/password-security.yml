name: Password security checks
on:
  push:
    branches: [feature/password-security-approval]
  pull_request:
    branches: [release/v1.2.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Password security regression tests
        run: node --test tests/password-security-stage*.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
