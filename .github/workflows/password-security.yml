name: Password security checks
on:
  push:
    branches: [feature/release-1.2.3-manual-payments-safety]
  pull_request:
    branches: [release/v1.2.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Password security regression tests
        run: node --test tests/password-security-stage*.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build
        if: always() && steps.checkout.outcome != 'failure'
        run: pnpm build
  mysql-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testonly
          MYSQL_DATABASE: novaworks_security_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestonly"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and validate lifecycle constraints
        env:
          MYSQL_PWD: testonly
        run: |
          mysql -h 127.0.0.1 -u root novaworks_security_test < tests/fixtures/password-security-mysql.sql
          mysql -h 127.0.0.1 -u root novaworks_security_test < mysql/migrations/2026-11-18-password-security.sql
          mysql -h 127.0.0.1 -u root novaworks_security_test < mysql/migrations/2026-11-19-password-notification-outbox.sql
          mysql -h 127.0.0.1 -u root novaworks_security_test -e "INSERT INTO password_security_requests(id,user_id,request_type,email,reason,otp_hash,otp_expires_at,expires_at) VALUES('00000000-0000-0000-0000-000000000002','00000000-0000-0000-0000-000000000001','forgot','sample@example.test','Testing workflow',REPEAT('a',64),DATE_ADD(UTC_TIMESTAMP(),INTERVAL 5 MINUTE),DATE_ADD(UTC_TIMESTAMP(),INTERVAL 24 HOUR)); UPDATE password_security_requests SET status='email_verified' WHERE id='00000000-0000-0000-0000-000000000002'; INSERT INTO password_notification_outbox(id,request_id,recipient_ciphertext,subject_ciphertext,body_ciphertext) VALUES('00000000-0000-0000-0000-000000000003','00000000-0000-0000-0000-000000000002','cipher','cipher','cipher'); SELECT status FROM password_security_requests;"
